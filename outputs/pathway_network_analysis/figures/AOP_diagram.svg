<svg height="920" width="680" style="background:white;" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 15px; font-weight: 600; fill: #2C2C2A; }
  .subtitle { font-size: 11px; fill: #5F5E5A; }
  .heading { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
  .body { font-size: 11px; fill: #444441; }
  .label-side { font-size: 11px; fill: #888780; }
  .evidence { font-size: 10px; fill: #5F5E5A; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text class="title" x="340" y="28" text-anchor="middle">Proposed AOP: Danube pollution → Daphnia magna</text>
<text class="subtitle" x="340" y="46" text-anchor="middle">Based on WGCNA MEblue module + cytoHubba hub gene analysis</text>

<!-- Left column: AOP level labels -->
<text class="label-side" x="38" y="105" text-anchor="start">Stressor</text>
<text class="label-side" x="38" y="225" text-anchor="start">MIE</text>
<text class="label-side" x="38" y="385" text-anchor="start">KE1 (molecular)</text>
<text class="label-side" x="38" y="535" text-anchor="start">KE2 (cellular)</text>
<text class="label-side" x="38" y="685" text-anchor="start">KE3 (organ)</text>
<text class="label-side" x="38" y="845" text-anchor="start">AO (population)</text>

<!-- Stressor box -->
<rect x="130" y="70" width="410" height="70" rx="8" fill="#F09595" stroke="#A32D2D" stroke-width="0.5"/>
<text class="heading" x="335" y="96" text-anchor="middle">Chemical pollution mixture</text>
<text class="body" x="335" y="116" text-anchor="middle">Diuron, metformin, sweeteners, pesticides</text>

<!-- Arrow -->
<line x1="335" y1="140" x2="335" y2="176" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- MIE box -->
<rect x="130" y="176" width="410" height="100" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text class="heading" x="335" y="200" text-anchor="middle">Molecular initiating event</text>
<text class="body" x="335" y="220" text-anchor="middle">Pollutants interact with membrane receptors</text>
<text class="body" x="195" y="252" text-anchor="middle">ITGB1 (#1 hub)</text>
<text class="body" x="335" y="252" text-anchor="middle">CD36 (#3 hub)</text>
<text class="body" x="475" y="252" text-anchor="middle">CD81</text>

<!-- Arrow -->
<line x1="335" y1="276" x2="335" y2="326" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- KE1: Two sub-boxes -->
<rect x="130" y="326" width="195" height="120" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="heading" x="228" y="350" text-anchor="middle">Stress response</text>
<text class="body" x="228" y="372" text-anchor="middle">HSP90AA1 (2/3 methods)</text>
<text class="body" x="228" y="392" text-anchor="middle">ACE (#8 hub, universal)</text>
<text class="body" x="228" y="412" text-anchor="middle">SOD3, CAT</text>

<rect x="345" y="326" width="195" height="120" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="heading" x="443" y="350" text-anchor="middle">Xenobiotic efflux</text>
<text class="body" x="443" y="372" text-anchor="middle">ABCG2 (2/3 methods)</text>
<text class="body" x="443" y="392" text-anchor="middle">ABCB1</text>
<text class="body" x="443" y="412" text-anchor="middle">ABCA1 (2/3 methods)</text>

<!-- Arrows from KE1 to KE2 -->
<line x1="228" y1="446" x2="228" y2="478" stroke="#555" stroke-width="1.2"/>
<line x1="443" y1="446" x2="443" y2="478" stroke="#555" stroke-width="1.2"/>
<line x1="228" y1="478" x2="335" y2="496" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="443" y1="478" x2="335" y2="496" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- KE2 box -->
<rect x="130" y="496" width="410" height="100" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="heading" x="335" y="520" text-anchor="middle">Lipid and lysosomal disruption</text>
<text class="body" x="195" y="544" text-anchor="middle">NPC2 (universal)</text>
<text class="body" x="335" y="544" text-anchor="middle">CTSD (2/3 methods)</text>
<text class="body" x="475" y="544" text-anchor="middle">SMPD1</text>
<text class="body" x="220" y="570" text-anchor="middle">ANPEP (#2 hub)</text>
<text class="body" x="400" y="570" text-anchor="middle">GLB1, MAN2B1</text>

<!-- Arrow -->
<line x1="335" y1="596" x2="335" y2="636" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- KE3 box -->
<rect x="130" y="636" width="410" height="100" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="heading" x="335" y="660" text-anchor="middle">Suppressed growth and reproduction</text>
<text class="body" x="335" y="684" text-anchor="middle">~10:1 down:up gene regulation ratio</text>
<text class="body" x="335" y="704" text-anchor="middle">Digestive proteases, growth genes suppressed</text>

<!-- Arrow -->
<line x1="335" y1="736" x2="335" y2="796" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- AO box -->
<rect x="130" y="796" width="410" height="100" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="heading" x="335" y="820" text-anchor="middle">Adverse outcome</text>
<text class="body" x="335" y="844" text-anchor="middle">Reduced fitness, fecundity, survival</text>
<text class="body" x="335" y="864" text-anchor="middle">Daphnia magna population decline</text>

<!-- Side annotation: Diuron -->
<rect x="555" y="326" width="105" height="50" rx="6" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="evidence" x="608" y="346" text-anchor="middle">Diuron</text>
<text class="evidence" x="608" y="362" text-anchor="middle">r = +0.585</text>
<line x1="555" y1="351" x2="540" y2="378" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Side annotation: D11/D12 -->
<rect x="555" y="636" width="105" height="50" rx="6" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="evidence" x="608" y="654" text-anchor="middle">D11: 1,570 DEGs</text>
<text class="evidence" x="608" y="670" text-anchor="middle">D12: 1,605 DEGs</text>
<line x1="555" y1="661" x2="540" y2="678" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>

</svg>